name: Build AR Termux

on:
  push:
    branches: [claude/admiring-newton-xmnkva]
    paths: ['termux-ar/**', '.github/workflows/android-termux.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch Termux at the pinned commit
        run: |
          git clone https://github.com/termux/termux-app termux-app
          git -C termux-app checkout "$(cat termux-ar/BASE_COMMIT)"
      - name: Apply Arabic patch
        run: |
          for p in termux-ar/patches/*.patch; do git -C termux-app apply --verbose "$GITHUB_WORKSPACE/$p"; done
      - name: Build debug APK
        working-directory: termux-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ar-termux-apk
          path: termux-app/app/build/outputs/apk/debug/*.apk
