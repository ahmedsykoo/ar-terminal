appId: com.arterminal.desktop
productName: AR Terminal
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  icon: ../media/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: System
mac:
  target: dmg
  category: public.app-category.developer-tools
